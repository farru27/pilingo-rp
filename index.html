<body>

  <main class="max-w-3xl mx-auto min-h-screen pb-28">

    <header class="sticky top-0 z-20 bg-[#09090b]/95 backdrop-blur border-b border-zinc-800">

      >
        <span class="text-lg">●</span>

      <a

  <!-- MODAL PERFIL -->
  <div

    <div class="w-full max-w-md bg-[#18181b] border border-zinc-800 rounded-3xl p-6">

      <div class="flex justify-between items-center mb-6">

        <div>
          <h2 class="text-xl font-black">

          <p class="text-sm text-zinc-500">
            Personaliza cómo apareces en el chat
          </p>
        </div>

        <button
          onclick="cerrarPerfil()"
          class="text-zinc-500 hover:text-white text-xl"
        >
          ✕
        </button>

      </div>


      <!-- FOTO -->
      <div class="flex justify-center mb-6">

        <img
          id="previewAvatar"

        >

      </div>


      <!-- NOMBRE -->

      <input

      >


      <!-- URL FOTO -->
      <label class="block text-sm text-zinc-400 mb-2">

      <input

      >

        Coloca el enlace directo de una imagen.

      <!-- GUARDAR -->
      <button

      >

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /*
    ============================================
    SUPABASE
    ============================================
    */

    const SUPABASE_URL =
      "https://tsoifqxyarbewjkzrmzw.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzb2lmcXh5YXJiZXdqa3pybXp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0OTQxODEsImV4cCI6MjEwMjA3MDE4MX0.kawBs-9V7X7UQqaE2GNRw-r7E9D_BELkXOyLrU0yPzI";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /*
    ============================================
    PERFIL
    ============================================
    */

    let perfil = JSON.parse(
      localStorage.getItem("pilingo_profile") || "null"
    );


    function perfilPorDefecto() {

      return {
        name: "Usuario",
        avatar:
          "https://ui-avatars.com/api/?name=Usuario&background=27272a&color=fff"
      };

    }


    function obtenerPerfil() {

      if (!perfil) {
        perfil = perfilPorDefecto();
      }

      return perfil;

    }


    function actualizarPerfilVisual() {

      const p = obtenerPerfil();

      document.getElementById("headerAvatar").src =
        p.avatar;

      document.getElementById("previewAvatar").src =
        p.avatar;

      document.getElementById("nameInput").value =
        p.name;

      document.getElementById("avatarInput").value =
        p.avatar;

    }


    function abrirPerfil() {

      actualizarPerfilVisual();

      document
        .getElementById("profileModal")
        .classList.remove("hidden");

    }


    function cerrarPerfil() {

      document
        .getElementById("profileModal")
        .classList.add("hidden");

    }


    function guardarPerfil() {

      const nombre =
        document
          .getElementById("nameInput")
          .value
          .trim();


      const avatar =
        document
          .getElementById("avatarInput")
          .value
          .trim();


      if (!nombre) {

        alert("Escribe un nombre.");

        return;

      }


      perfil = {

        name: nombre,

        avatar:
          avatar ||
          `https://ui-avatars.com/api/?name=${encodeURIComponent(nombre)}&background=27272a&color=fff`

      };


      localStorage.setItem(
        "pilingo_profile",
        JSON.stringify(perfil)
      );


      actualizarPerfilVisual();

      cerrarPerfil();

    }


    /*
    ============================================
    ESCAPAR HTML
    ============================================
    */

    function escaparHTML(texto) {

      const div =
        document.createElement("div");

      div.textContent =
        texto || "";

      return div.innerHTML;

    }


    /*
    ============================================
    MOSTRAR MENSAJE
    ============================================
    */

    function mostrarMensaje(mensaje) {

      const container =
        document.getElementById("messages");


      const loading =
        document.getElementById("loading");


      if (loading) {
        loading.remove();
      }


      const nombre =
        escaparHTML(
          mensaje.username || "Usuario"
        );


      const contenido =
        escaparHTML(
          mensaje.message || ""
        );


      const avatar =
        mensaje.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(nombre)}&background=27272a&color=fff`;


      const div =
        document.createElement("div");


      div.className =
        "message flex gap-3 mb-5";


      div.innerHTML = `

        <img
          src="${avatar}"
          class="avatar"
          onerror="this.src='https://ui-avatars.com/api/?name=Usuario&background=27272a&color=fff'"
        >

        <div class="min-w-0">

          <div class="flex items-center gap-2">

            <span class="font-bold text-sm">
              ${nombre}
            </span>

            <span class="text-xs text-zinc-600">
              ${formatearFecha(mensaje.created_at)}
            </span>

          </div>

          <p class="text-zinc-300 break-words mt-1">
            ${contenido}
          </p>

        </div>

      `;


      container.appendChild(div);

      container.scrollTop =
        container.scrollHeight;

    }


    /*
    ============================================
    FECHA
    ============================================
    */

    function formatearFecha(fecha) {

      if (!fecha) return "";

      return new Date(fecha).toLocaleTimeString(
        "es-UY",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
    ============================================
    CARGAR MENSAJES
    ============================================
    */

    async function cargarMensajes() {

      const {
        data,
        error
      } = await supabaseClient
        .from("chat_messages")
        .select("*")
        .order("created_at", {
          ascending: true
        })
        .limit(100);


      if (error) {

        console.error(error);

        document.getElementById("messages").innerHTML = `

          <div class="text-center py-20 text-red-400">

            No se pudieron cargar los mensajes.

            <p class="text-xs text-zinc-600 mt-2">
              ${escaparHTML(error.message)}
            </p>

          </div>

        `;

        return;

      }


      const container =
        document.getElementById("messages");

      container.innerHTML = "";


      if (!data || data.length === 0) {

        container.innerHTML = `

          <div
            id="loading"
            class="text-center text-zinc-600 py-20"
          >
            Todavía no hay mensajes.<br>
            ¡Sé el primero en escribir! 🔥
          </div>

        `;

        return;

      }


      data.forEach(
        mostrarMensaje
      );

    }


    /*
    ============================================
    ENVIAR MENSAJE
    ============================================
    */

    document
      .getElementById("messageForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const input =
            document.getElementById("messageInput");


          const texto =
            input.value.trim();


          if (!texto) return;


          const p =
            obtenerPerfil();


          input.disabled = true;


          const {
            error
          } = await supabaseClient
            .from("chat_messages")
            .insert({

              username: p.name,

              avatar_url: p.avatar,

              message: texto

            });


          input.disabled = false;


          if (error) {

            console.error(error);

            alert(
              "No se pudo enviar el mensaje:\n" +
              error.message
            );

            return;

          }


          input.value = "";

          input.focus();

        }
      );


    /*
    ============================================
    TIEMPO REAL
    ============================================
    */

    supabaseClient
      .channel("pilingo-chat")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "chat_messages"
        },
        function(payload) {

          mostrarMensaje(
            payload.new
          );

        }
      )
      .subscribe();


    /*
    ============================================
    PREVISUALIZAR FOTO
    ============================================
    */

    document
      .getElementById("avatarInput")
      .addEventListener(
        "input",
        function() {

          const url =
            this.value.trim();


          if (url) {

            document
              .getElementById("previewAvatar")
              .src = url;

          }

        }
      );


    /*
    ============================================
    INICIAR
    ============================================
    */

    actualizarPerfilVisual();

    cargarMensajes();

  </script>

</body>
</html>
